# Snapshot of /opt/homebrew/etc/grafana/grafana.ini on the mini.
# Minimal override file: any key not set here falls back to Grafana's
# shipped defaults (Homebrew's stock copy of this file is all comments
# anyway, so replacing it loses nothing).
# First login: admin/admin - Grafana forces a password change immediately.

[paths]
# Without this, Grafana looks for provisioning in its install dir
# (homepath/conf/provisioning) and silently ignores the files below /opt/
# homebrew/etc/grafana/provisioning - symptom: no datasource, no dashboards.
provisioning = /opt/homebrew/etc/grafana/provisioning

[server]
# LAN-only, same discipline as unbound and Prometheus. Grafana is
# network-facing, so it needs the socketfilterfw allow treatment on its
# resolved Cellar binary - and again after every brew upgrade (CLAUDE.md).
http_addr = 192.168.0.100
http_port = 3000

[analytics]
reporting_enabled = false
check_for_updates = false

[news]
news_feed_enabled = false

[log]
# Log to Grafana's own file only, NOT the console. The launchd wrapper
# redirects console (stdout/stderr) to unbound-grafana-launchd.log, which
# nothing rotates - and Grafana 12's bleve search backend emits index
# build/evict lines at info level every few minutes, so that file grew
# ~1.3 MB/day unbounded (observed 2026-07-07). Grafana's file logger
# (/opt/homebrew/var/log/grafana/grafana.log) self-rotates by default
# (7 daily copies), so the record is kept; only the un-rotated console
# duplicate stops. Pre-logger-init panics still reach launchd stdout.
mode = file
level = info
