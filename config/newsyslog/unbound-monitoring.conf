# Snapshot of /etc/newsyslog.d/unbound-monitoring.conf on the mini.
# Rotates the SCHEDULED-job logs: these files are only open while a job runs,
# so newsyslog's rename-style rotation is safe. macOS runs newsyslog every
# 30 minutes; entries here rotate on size (1 MB), keep 5 gzipped generations.
#
# Deliberately NOT rotated: the KeepAlive daemon logs (unbound-exporter,
# unbound-blackbox, prometheus, node_exporter, unbound-grafana-launchd,
# unbound-alertnotify). Those processes hold their stdout fd open forever, so
# a rename would leave them writing to the rotated file and the fresh file
# empty until the next restart. They emit only startup/reload lines and reset
# naturally on every reboot - revisit only if one is ever observed growing.
#
# Format: logfilename  mode count size(KB) when flags
#   N = no signal needed,  Z = gzip old logs,  * = no time-based trigger
/opt/homebrew/var/log/unbound-blocklist.log             644  5  1024  *  NZ
/opt/homebrew/var/log/unbound-warmlist.log              644  5  1024  *  NZ
/opt/homebrew/var/log/unbound-warmboot.log              644  5  1024  *  NZ
/opt/homebrew/var/log/apple-content-cache-exporter.log  644  5  1024  *  NZ
/opt/homebrew/var/log/unbound-roothints.log             644  5  1024  *  NZ
