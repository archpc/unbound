# -> /opt/homebrew/etc/grafana/provisioning/dashboards/unbound.yml
# File-provisioned dashboards: Grafana loads every JSON in options.path.
# The generator and five checked-in JSON files under config/grafana/dashboards
# are the source of truth. UI edits are intentionally disabled.
apiVersion: 1

providers:
  - name: unbound
    orgId: 1
    folder: ""
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    # Repository JSON is canonical. UI edits cannot be written back to the
    # provisioning source and would be overwritten on the next scan.
    allowUiUpdates: false
    options:
      path: /opt/homebrew/etc/grafana/dashboards
