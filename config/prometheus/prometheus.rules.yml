# Snapshot of /opt/homebrew/etc/prometheus.rules.yml on the mini.
# No Alertmanager is configured, so nothing pages - firing alerts show up in
# the Prometheus UI at http://192.168.0.100:9090/alerts (and as the
# ALERTS{alertstate="firing"} series, graphable like any other metric).
#
# Metric names follow unbound_exporter's mapping of unbound-control stats
# (total.num.cachehits -> unbound_cache_hits_total, etc.). After first deploy,
# sanity-check them against reality before trusting the rules:
#   curl -s http://127.0.0.1:9167/metrics | /usr/bin/grep -E 'unbound_(up|cache_hits|request_list)'

groups:
  # Canonical dashboard expressions. Evaluated at the global 15s interval.
  # Aggregations intentionally drop source labels only where the dashboard asks
  # a stack-wide question. Unless a rule explicitly uses `or vector(0)`, missing
  # input remains an empty result so Grafana renders UNKNOWN rather than green.
  - name: dashboard-recording
    interval: 15s
    rules:
      # Expected inventory is the exact cardinality of each repository-defined
      # job plus eight total targets. `or vector(0)` makes a missing job an
      # explicit mismatch instead of an empty result.
      - record: monitoring:target_inventory_ok
        expr: |
          (((count(up{job="unbound"}) or vector(0)) == bool 1)
            * on() ((count(up{job="prometheus"}) or vector(0)) == bool 1)
            * on() ((count(up{job="node"}) or vector(0)) == bool 1)
            * on() ((count(up{job="blackbox_upstream"}) or vector(0)) == bool 2)
            * on() ((count(up{job="blackbox_resolver"}) or vector(0)) == bool 1)
            * on() ((count(up{job="blackbox_rpz_canary"}) or vector(0)) == bool 1)
            * on() ((count(up{job="blackbox_grafana"}) or vector(0)) == bool 1)
            * on() ((count(up) or vector(0)) == bool 8))

      # A successful query plus an empty down-set legitimately means zero down;
      # the separate inventory rule prevents that zero from hiding removed jobs.
      - record: monitoring:targets_down
        expr: |
          (count(up == 0) or vector(0))
            and on() (monitoring:target_inventory_ok == 1)

      - record: monitoring:active_alerts
        expr: count(ALERTS{alertstate="firing"}) or vector(0)

      # Core collection health: Prometheus, node, Unbound, and every blackbox
      # scrape must be up, and the full inventory must still be present.
      - record: monitoring:collection_path_healthy
        expr: |
          min(up{job=~"unbound|prometheus|node|blackbox_.*"})
            * on() monitoring:target_inventory_ok

      # node_exporter is the shared path for every custom textfile producer.
      # Missing node_textfile_scrape_error is treated as failed only while the
      # represented node target supplies the left-hand state.
      - record: monitoring:textfile_path_healthy
        expr: |
          (max(up{job="node"}) == bool 1)
            * on() ((max(node_textfile_scrape_error) or vector(1)) == bool 0)

      # Local notifier readiness requires a recent complete run, fresh alert
      # evidence, safe resolution state, durable persistence, a valid topic,
      # and no current run failure. It cannot prove ntfy server acceptance when
      # there was nothing to publish, and server acceptance cannot prove that
      # the phone received a push.
      - record: monitoring:notifier_local_path_healthy
        expr: |
          (time() - max(unbound_job_last_success_timestamp_seconds{task="alertnotify"}) < bool 600)
            * on() (max(unbound_ntfy_prometheus_query_success) == bool 1)
            * on() (max(unbound_ntfy_alert_state_processed) == bool 1)
            * on() (max(unbound_ntfy_resolutions_enabled) == bool 1)
            * on() (max(unbound_ntfy_state_persistence_success) == bool 1)
            * on() (max(unbound_ntfy_topic_ready) == bool 1)
            * on() (max(unbound_ntfy_consecutive_failures) == bool 0)

      # The healthier public-recursive path is the established WAN/UDP-53
      # witness. Both expected result series must exist; a missing probe is
      # unknown, not permission to call the surviving path representative.
      - record: dns:upstream_best_success_ratio_10m
        expr: |
          max(avg_over_time(probe_success{job="blackbox_upstream"}[10m]))
            and on() (count(probe_success{job="blackbox_upstream"}) == 2)

      # Empty under <=1 cache lookup/s, by design: idle traffic is not a 0%
      # hit ratio. Worker-thread labels are summed before the ratio is formed.
      - record: unbound:cache_hit_ratio_15m
        expr: |
          (
            sum(rate(unbound_cache_hits_total[15m]))
              / (
                sum(rate(unbound_cache_hits_total[15m]))
                  + sum(rate(unbound_cache_misses_total[15m]))
              )
          )
          and on() (
            sum(rate(unbound_cache_hits_total[15m]))
              + sum(rate(unbound_cache_misses_total[15m])) > 1
          )

      # Apple Metrics.db supplies additive local-cache, origin, parent, and
      # peer bytes. Ratios are absent on zero traffic or unavailable source data.
      - record: apple_content_cache:local_hit_ratio_24h
        expr: |
          (
            apple_content_cache_cache_to_client_last_24h_bytes
              / apple_content_cache_total_to_client_last_24h_bytes
          )
          and on() (apple_content_cache_total_to_client_last_24h_bytes > 0)
          and on() (apple_content_cache_traffic_metrics_available == 1)

      - record: apple_content_cache:origin_fraction_24h
        expr: |
          (
            apple_content_cache_origin_to_client_last_24h_bytes
              / apple_content_cache_total_to_client_last_24h_bytes
          )
          and on() (apple_content_cache_total_to_client_last_24h_bytes > 0)
          and on() (apple_content_cache_traffic_metrics_available == 1)

      - record: apple_content_cache:other_source_fraction_24h
        expr: |
          (
            clamp_min(
              apple_content_cache_total_to_client_last_24h_bytes
                - apple_content_cache_cache_to_client_last_24h_bytes
                - apple_content_cache_origin_to_client_last_24h_bytes,
              0
            ) / apple_content_cache_total_to_client_last_24h_bytes
          )
          and on() (apple_content_cache_total_to_client_last_24h_bytes > 0)
          and on() (apple_content_cache_traffic_metrics_available == 1)

  # Failures in the monitoring paths themselves. These alerts prevent a
  # vanished exporter or target definition from masquerading as healthy data.
  - name: monitoring
    rules:
      - alert: PrometheusTargetInventoryMismatch
        expr: monitoring:target_inventory_ok == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Prometheus target inventory differs from the provisioned job cardinalities"
          description: "An expected job may be missing or duplicated, or an unexpected job may exist, even when every represented target is healthy."

      - alert: NodeExporterDown
        expr: up{job="node"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "node_exporter is down - host and every textfile metric share this failure"

      - alert: BlackboxExporterDown
        expr: min(up{job=~"blackbox_.*"}) == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "one or more blackbox scrape paths are down"
          description: "Correlated missing probe_success series can be an exporter failure rather than simultaneous DNS/Grafana failures."

      - alert: BlackboxProbeResultInventoryMismatch
        expr: |
          ((count(probe_success{job="blackbox_upstream"}) or vector(0)) != 2)
          or ((count(probe_success{job="blackbox_resolver"}) or vector(0)) != 1)
          or ((count(probe_success{job="blackbox_rpz_canary"}) or vector(0)) != 1)
          or ((count(probe_success{job="blackbox_grafana"}) or vector(0)) != 1)
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Blackbox probe result-series inventory differs from configuration"
          description: "A missing probe_success series is unknown monitoring state, not a successful or failed target result."

      - alert: PrometheusConfigReloadFailed
        expr: prometheus_config_last_reload_successful == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Prometheus reports that its most recent configuration reload failed"

      - alert: PrometheusSelfScrapeDown
        expr: up{job="prometheus"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Prometheus cannot scrape its own metrics endpoint"
          description: "This catches self-scrape/configuration failure; a fully stopped Prometheus still requires an independent external witness."

      - alert: PrometheusRuleEvaluationFailures
        expr: increase(prometheus_rule_evaluation_failures_total[5m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "Prometheus rule evaluation failures occurred in the last five minutes"

  # Watches the launchd automation itself, via success breadcrumbs each
  # script drops into node_exporter's textfile directory
  # (/opt/homebrew/var/lib/node_exporter/textfile). A stale timestamp means
  # the job is silently dead - not running, or running and failing.
  # NB: a job that has NEVER succeeded has no breadcrumb at all, and absent
  # metrics can't fire these rules - seed them once (kickstart each job).
  - name: automation
    rules:
      # daily 03:30 job; 26h = one missed run plus slack
      - alert: BlocklistUpdateStale
        expr: |
          (time() - unbound_job_last_success_timestamp_seconds{task="blocklist"} > 93600)
            and on() (up{job="node"} == 1)
        annotations:
          summary: "update-blocklist.sh hasn't succeeded in >26h"

      - alert: BlocklistBreadcrumbAbsent
        expr: |
          absent(unbound_job_last_success_timestamp_seconds{task="blocklist"})
            and on() (up{job="node"} == 1)
        for: 15m
        annotations:
          summary: "blocklist job breadcrumb metric is missing entirely"
          description: "Stale-age rules cannot detect an absent series. This may mean the job never seeded, the textfile was deleted, or node_exporter rejected the breadcrumb sample."

      # daily 23:30 job
      - alert: WarmlistMineStale
        expr: |
          (time() - unbound_job_last_success_timestamp_seconds{task="warmlist"} > 93600)
            and on() (up{job="node"} == 1)
        annotations:
          summary: "build-warm-list.sh hasn't succeeded in >26h"

      - alert: WarmlistBreadcrumbAbsent
        expr: |
          absent(unbound_job_last_success_timestamp_seconds{task="warmlist"})
            and on() (up{job="node"} == 1)
        for: 15m
        annotations:
          summary: "warmlist job breadcrumb metric is missing entirely"
          description: "Stale-age rules cannot detect an absent series. This may mean the job never seeded, the textfile was deleted, or node_exporter rejected the breadcrumb sample."

      # monthly job (1st, 03:00); 34d = one missed month plus slack
      - alert: RootHintsRefreshStale
        expr: |
          (time() - unbound_job_last_success_timestamp_seconds{task="roothints"} > 2937600)
            and on() (up{job="node"} == 1)
        annotations:
          summary: "unbound-refresh-hints hasn't succeeded in >34 days"

      - alert: RootHintsBreadcrumbAbsent
        expr: |
          absent(unbound_job_last_success_timestamp_seconds{task="roothints"})
            and on() (up{job="node"} == 1)
        for: 15m
        annotations:
          summary: "roothints job breadcrumb metric is missing entirely"
          description: "Stale-age rules cannot detect an absent series. This may mean the job never seeded, the textfile was deleted, or node_exporter rejected the breadcrumb sample."

      # breadcrumb predates the current boot = warmboot didn't complete this
      # boot. for: 15m gives the boot sequence (unbound's launch race + the
      # warmup itself) time to finish before this counts as a failure.
      - alert: WarmbootDidNotRun
        expr: |
          ((scalar(node_boot_time_seconds)
            - unbound_job_last_success_timestamp_seconds{task="warmboot"}) > 0)
            and on() (up{job="node"} == 1)
        for: 15m
        annotations:
          summary: "warm-at-boot.sh has not succeeded since the last reboot"

      - alert: WarmbootBreadcrumbAbsent
        expr: |
          absent(unbound_job_last_success_timestamp_seconds{task="warmboot"})
            and on() (up{job="node"} == 1)
        for: 15m
        annotations:
          summary: "warmboot job breadcrumb metric is missing entirely"
          description: "Stale-age rules cannot detect an absent series. This may mean the job never seeded, the textfile was deleted, or node_exporter rejected the breadcrumb sample."

      # Mirrors the selected source's own validated floor. The producer emits
      # both values from the same successful update, avoiding a universal 100k
      # assumption that was wrong for the supported oisd-small source.
      - alert: BlocklistSuspiciouslySmall
        expr: unbound_blocklist_lines < unbound_blocklist_minimum_lines
        annotations:
          summary: "deployed blocklist is smaller than the selected source's validated floor"

      - alert: BlocklistMinimumMetricAbsent
        expr: |
          absent(unbound_blocklist_minimum_lines)
            and on() (up{job="node"} == 1)
        for: 15m
        annotations:
          summary: "blocklist source-floor metric is absent - re-seed the updated blocklist producer"

      # A dead contentcache job is otherwise INVISIBLE: node_exporter keeps
      # serving the last .prom file forever, so every gauge looks alive.
      # The file's own mtime is the only honest freshness signal.
      # Job runs every 300s; 900s = three missed runs.
      - alert: ContentCacheExporterStale
        expr: |
          (time() - node_textfile_mtime_seconds{file="/opt/homebrew/var/lib/node_exporter/textfile/apple-content-cache.prom"} > 900)
            and on() (up{job="node"} == 1)
        annotations:
          summary: "apple-content-cache.prom not rewritten in >15m - contentcache job dead?"

      - alert: ContentCacheTextfileMissing
        expr: |
          absent(node_textfile_mtime_seconds{file="/opt/homebrew/var/lib/node_exporter/textfile/apple-content-cache.prom"})
            and on() (up{job="node"} == 1)
        for: 15m
        annotations:
          summary: "Apple Content Cache textfile metric is missing entirely"
          description: "Catches never-seeded or deleted apple-content-cache.prom cases that stale-mtime rules cannot detect because the mtime series is absent."

      # Catches malformed .prom files (bad exposition format) from ANY
      # textfile writer - the collector skips bad files silently otherwise.
      - alert: TextfileScrapeError
        expr: node_textfile_scrape_error > 0
        annotations:
          summary: "node_exporter textfile collector failed to parse a .prom file"

      # The alert NOTIFIER going stale is the one alert that can't reach your
      # phone (it's the thing that pushes) - it only shows here and on the
      # dashboard. Runs every 120s; 600s = five missed runs.
      - alert: AlertNotifierStale
        expr: |
          (time() - unbound_job_last_success_timestamp_seconds{task="alertnotify"} > 600)
            and on() (up{job="node"} == 1)
        annotations:
          summary: "prometheus_alert_notifier.py has not completed a full state-processing run in >10m"
          description: "This proves the local notifier path is stale. It does not prove whether any earlier ntfy-accepted request reached the phone."

      # Same absent-series trap as clientstats below: stale-age rules cannot
      # fire when the breadcrumb series is missing entirely.
      - alert: AlertNotifierBreadcrumbAbsent
        expr: |
          absent(unbound_job_last_success_timestamp_seconds{task="alertnotify"})
            and on() (up{job="node"} == 1)
        for: 15m
        annotations:
          summary: "alertnotify breadcrumb metric absent - missing .prom sample or textfile merge rejection"
          description: "Catches a missing alertnotify breadcrumb, which AlertNotifierStale cannot see because stale-age rules evaluate empty when the series is absent."

      # Runs every 120s; 900s = seven missed runs. Guards a failure class
      # proven silent on 2026-07-09: node_exporter rejected the clientstats
      # breadcrumb sample over a HELP-string conflict while
      # node_textfile_scrape_error stayed 0 - TextfileScrapeError sees only
      # unparseable FILES, not samples dropped during the family merge. The
      # breadcrumb going stale is the one signal that catches a dead job, a
      # broken log-show parse, AND a rejected-sample regression alike.
      - alert: ClientStatsStale
        expr: |
          (time() - unbound_job_last_success_timestamp_seconds{task="clientstats"} > 900)
            and on() (up{job="node"} == 1)
        annotations:
          summary: "unbound_client_rpz_exporter.py breadcrumb stale >15m - job dead or its samples rejected by node_exporter"

      # Stale-rules can't fire on a metric that isn't there at all (header
      # note above): this covers the never-seeded / file-deleted / sample-
      # rejected-at-merge cases for the newest job. for: 15m rides out
      # node_exporter restarts.
      - alert: ClientStatsBreadcrumbAbsent
        expr: |
          absent(unbound_job_last_success_timestamp_seconds{task="clientstats"})
            and on() (up{job="node"} == 1)
        for: 15m
        annotations:
          summary: "clientstats breadcrumb metric absent - job never seeded, .prom file gone, or sample rejected in the textfile merge"

      # >= 2 failed pushes in 30m = the phone channel itself is broken, not a
      # blip. Inherently dashboard-only (a broken channel can't push its own
      # failure) - same circular gap as AlertNotifierStale. Counter persists
      # in the notifier's state file; increase() tolerates a reset.
      - alert: NtfyDeliveryFailures
        expr: increase(unbound_ntfy_delivery_failures_total[30m]) >= 2
        annotations:
          summary: "2+ notifier transitions were not accepted by the ntfy server in 30m"
          description: "The 30m increase window can remain firing briefly after server acceptance recovers. This local alert is circular when the failed path is the only notification transport, and HTTP acceptance never proves phone receipt."

      # Read-only Time Machine collector, every 900s. The mtime guard detects a
      # job that stopped rewriting; collection_success catches a fresh but failed
      # state read. Unconfigured Time Machine is reported as disabled, not bad.
      - alert: TimeMachineMonitoringUnhealthy
        expr: |
          (up{job="node"} == 1)
          and on() (
            (time() - node_textfile_mtime_seconds{file=~".*/time-machine\\.prom"} > 3600)
            or absent(node_textfile_mtime_seconds{file=~".*/time-machine\\.prom"})
            or (time_machine_exporter_collection_success == 0)
            or absent(time_machine_exporter_collection_success)
            or absent(time_machine_destination_configured)
            or absent(time_machine_backup_running)
            or absent(time_machine_latest_backup_available)
            or (
              (time_machine_destination_configured == 1)
              and on() (time_machine_latest_backup_available == 1)
              and on() absent(time_machine_latest_backup_timestamp_seconds)
            )
          )
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Time Machine monitoring is stale, missing, or failed"

      # The observed schedule was hourly on 2026-07-14. Six hours is an
      # engineering warning boundary; the dashboard escalates visual severity
      # again at 24 hours. No alert fires when no destination is configured.
      - alert: TimeMachineBackupStaleOrMissing
        expr: |
          (time_machine_destination_configured == 1)
          and on() (
            (time_machine_latest_backup_available == 0)
            or (time() - time_machine_latest_backup_timestamp_seconds > 21600)
          )
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Time Machine has no available backup newer than six hours"

  - name: host
    rules:
      # The TSDB, logs, and Time Machine target all live on this box - catch
      # disk exhaustion before launchd jobs start failing in confusing ways.
      - alert: DiskAlmostFull
        expr: |
          min by (mountpoint) (
            node_filesystem_avail_bytes{fstype=~"apfs|hfs"}
              / node_filesystem_size_bytes{fstype=~"apfs|hfs"}
          ) < 0.10
        for: 30m
        annotations:
          summary: "filesystem {{ $labels.mountpoint }} is over 90% full"

      # Trend-based warning, complementing DiskAlmostFull's instant-percentage
      # check: fires on WHERE THINGS ARE HEADED, before root actually crosses
      # 10%. 3d window (not 24h) + a boot-settled gate are load-bearing, not
      # decoration - verified live 2026-07-06 that a naive 24h-window/no-gate
      # version predicts -237 GiB in 7d on a 7h-old boot, because the box's
      # first day of life includes one-time cost (initial blocklist download,
      # Grafana's first-run plugin installs, pre-compaction TSDB growth) that
      # a short lookback can't distinguish from a recurring daily drain. count_
      # over_time requires the window to be genuinely ~70%+ full of real
      # samples (not just technically present); the boot-settled gate refuses
      # to trust a week-ahead extrapolation until a full day of steady-state
      # history exists past the last restart.
      - alert: RootDiskFreePredictedLow
        expr: |
          predict_linear(node_filesystem_avail_bytes{mountpoint="/"}[3d], 7 * 24 * 3600) < 10 * 1024 * 1024 * 1024
          and count_over_time(node_filesystem_avail_bytes{mountpoint="/"}[3d]) > 12000
          and (time() - node_boot_time_seconds) > 86400
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "root disk trending below 10 GiB free within 7 days at current rate"

      # Short-horizon companion: 6h window is fine for a 24h reach (verified
      # live: 64.95 GiB predicted vs the [3d]->7d version's -237 GiB garbage
      # at the same moment - a week out needs a wider, damped window; a day
      # out doesn't). Still gated on sample count so a freshly-reset TSDB
      # (not just a reboot - node_exporter itself restarting) can't trigger it
      # on a near-empty window.
      - alert: RootDiskFreePredictedCritical
        expr: |
          predict_linear(node_filesystem_avail_bytes{mountpoint="/"}[6h], 24 * 3600) < 5 * 1024 * 1024 * 1024
          and count_over_time(node_filesystem_avail_bytes{mountpoint="/"}[6h]) > 1000
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "root disk trending below 5 GiB free within 24 hours - act now"

  - name: probes
    rules:
      # BOTH public resolvers unreachable on plain :53 from this box - the
      # outside-in signature of the 2026-07-01 incident. max()==0 means every
      # upstream target failed; a single one failing is their outage, not ours.
      - alert: UpstreamDNSPathDown
        expr: |
          (max(probe_success{job="blackbox_upstream"}) == 0)
            and on() (count(probe_success{job="blackbox_upstream"}) == 2)
        for: 5m
        annotations:
          summary: "1.1.1.1 AND 8.8.8.8 unreachable on :53 - upstream path dead (2026-07-01 signature)"

      # Detect sustained partial loss without paging on one public resolver's
      # isolated outage. max() selects the healthier target; if even that
      # target is below 95% over 10m, both observed upstream paths are degraded.
      - alert: UpstreamDNSPathDegraded
        expr: dns:upstream_best_success_ratio_10m < 0.95
        for: 5m
        annotations:
          summary: "both upstream DNS probe paths are below 95% success over 10m"
          description: "Intermittent WAN or UDP/53 loss can make uncached DNS queries stall while cached answers remain fast."

      # Daemon-liveness from a client's vantage point - NOT recursion health.
      # The probe re-queries the same name every 30s, and prefetch +
      # serve-expired (ttl 86400, client-timeout 0) mean unbound answers it
      # from cache for up to a day even with recursion fully dead. So this
      # fires only when unbound stops ANSWERING; dead recursion is caught by
      # UpstreamDNSPathDown and UnboundRequestListJammed instead.
      - alert: ResolverNotAnswering
        expr: probe_success{job="blackbox_resolver"} == 0
        for: 5m
        annotations:
          summary: "unbound not answering probes on 192.168.0.100 - daemon down/unreachable (recursion health: UpstreamDNSPathDown / UnboundRequestListJammed)"

      # Canary probe succeeds only while RPZ blocks google-analytics.com.
      # Firing means ad-blocking silently stopped (bad blocklist update,
      # zone misload) - DNS still "works", so nobody would otherwise notice.
      - alert: RPZCanaryNotBlocking
        expr: probe_success{job="blackbox_rpz_canary"} == 0
        for: 30m
        annotations:
          summary: "RPZ is no longer blocking the canary - blocklist likely broken"

      # Grafana down/firewalled (classic cause: brew upgrade changed the
      # Cellar path and invalidated the socketfilterfw allow).
      - alert: GrafanaDown
        expr: probe_success{job="blackbox_grafana"} == 0
        for: 5m
        annotations:
          summary: "Grafana /api/health failed HTTP or database validation"

  - name: unbound
    rules:
      # Exporter itself unreachable (crashed / not loaded).
      - alert: UnboundExporterDown
        expr: up{job="unbound"} == 0
        for: 5m
        annotations:
          summary: "Prometheus cannot scrape unbound_exporter on 127.0.0.1:9167"

      # Exporter is up but unbound-control is not answering. Expected for the
      # first ~10s of boot (known opendirectoryd race); 2m of it is real.
      - alert: UnboundDown
        expr: |
          (unbound_up == 0)
          or (
            absent(unbound_up)
            and on() (up{job="unbound"} == 1)
          )
        for: 2m
        annotations:
          summary: "unbound-control not answering the exporter"

      # The 2026-07-01 incident signature: recursion dead upstream while
      # cache/serve-expired mask it from clients. Requestlist backs up long
      # before the household notices - this is the early tripwire.
      - alert: UnboundRequestListJammed
        expr: sum(unbound_request_list_current_all) > 100
        for: 10m
        annotations:
          summary: "requestlist jammed - upstream path likely dead (see 2026-07-01 incident)"

      # Sustained cold cache during real traffic; ignores idle periods by
      # requiring a minimum query rate before judging the hit ratio.
      # sum() across threads: the counters are per-thread (verified live
      # 2026-07-04), and without it this would fire once per thread.
      - alert: UnboundCacheHitRateLow
        expr: unbound:cache_hit_ratio_15m < 0.5
        for: 30m
        annotations:
          summary: "cache hit rate below 50% for 30m under real load"
