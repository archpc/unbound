# Snapshot of /opt/homebrew/etc/prometheus.yml on the mini.
# Deploy: copy there, `promtool check config /opt/homebrew/etc/prometheus.yml`,
# then `sudo launchctl kickstart -k system/local.unbound.prometheus`
# (Prometheus runs as an unprivileged localadmin LaunchDaemon - see
# launchd/local.unbound.prometheus.plist; only unbound_exporter runs as
# root, for the control socket).

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /opt/homebrew/etc/prometheus.rules.yml

scrape_configs:
  # unbound_exporter (local.unbound.exporter LaunchDaemon), loopback-only
  - job_name: unbound
    static_configs:
      - targets: ["127.0.0.1:9167"]

  # Prometheus scraping itself; local self-scrape via loopback
  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]

  # host metrics (CPU, memory, disk, network) - node_exporter via the
  # local.unbound.nodeexporter LaunchDaemon, loopback-only
  - job_name: node
    static_configs:
      - targets: ["127.0.0.1:9100"]

  # blackbox DNS probes - outside-in checks. Every blackbox_* job probes
  # THROUGH the exporter on 127.0.0.1:9115: the relabeling turns each listed
  # target into the ?target= parameter and keeps it as the instance label.
  # 30s interval: these send real DNS queries, no need for 15s granularity.

  # raw upstream path on :53, bypassing unbound (2026-07-01 failure mode)
  - job_name: blackbox_upstream
    metrics_path: /probe
    params:
      module: [dns_upstream]
    scrape_interval: 30s
    static_configs:
      - targets: ["1.1.1.1", "8.8.8.8"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 127.0.0.1:9115

  # resolver answering-at-all, from a client's vantage point. NOT proof of
  # fresh recursion: the probe repeats one name every 30s and serve-expired
  # answers it from cache for up to a day with recursion dead (see rules).
  - job_name: blackbox_resolver
    metrics_path: /probe
    params:
      module: [dns_resolver]
    scrape_interval: 30s
    static_configs:
      - targets: ["192.168.0.100"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 127.0.0.1:9115

  # RPZ canary: probe succeeds only while google-analytics.com is NXDOMAIN
  - job_name: blackbox_rpz_canary
    metrics_path: /probe
    params:
      module: [dns_rpz_canary]
    scrape_interval: 30s
    static_configs:
      - targets: ["192.168.0.100"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 127.0.0.1:9115

  # Grafana health through its small JSON health endpoint. This replaces a
  # direct /metrics scrape that produced 5,790 unused samples every 15s in the
  # 2026-07-14 audit. The probe requires HTTP 200 and database="ok".
  - job_name: blackbox_grafana
    metrics_path: /probe
    params:
      module: [http_grafana_health]
    scrape_interval: 30s
    static_configs:
      - targets: ["http://192.168.0.100:3000/api/health"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 127.0.0.1:9115
