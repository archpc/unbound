# Snapshot of /etc/ssh/sshd_config.d/500-keyonly.conf on the mini.
#
# Key-only SSH: refuse passwords and keyboard-interactive, so the only way in
# is a key in an account's authorized_keys. Added 2026-07-07 to kill remote
# password brute-force as a threat (the job fail2ban would otherwise do, done
# structurally instead). The sole login path is localadmin's ED25519 key
# (sein@Honk.local); no other account on the box has authorized_keys.
#
# sshd reads /etc/ssh/sshd_config.d/* (Include at line ~19 of sshd_config) and
# takes the FIRST value seen for each keyword; the stock 100-macos.conf sets
# neither of these, so this file wins. macOS launches sshd per-connection, so
# a new file takes effect on the NEXT connection - no reload, existing sessions
# unaffected (that's the safety net: test a fresh login before trusting it).
#
# REVERT: remove this file (sudo rm) - the next connection is back to defaults.

PasswordAuthentication no
KbdInteractiveAuthentication no
