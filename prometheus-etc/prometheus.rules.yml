# Snapshot of /opt/homebrew/etc/prometheus.rules.yml on the mini.
# No Alertmanager is configured, so nothing pages - firing alerts show up in
# the Prometheus UI at http://192.168.0.100:9090/alerts (and as the
# ALERTS{alertstate="firing"} series, graphable like any other metric).
#
# Metric names follow unbound_exporter's mapping of unbound-control stats
# (total.num.cachehits -> unbound_cache_hits_total, etc.). After first deploy,
# sanity-check them against reality before trusting the rules:
#   curl -s http://127.0.0.1:9167/metrics | /usr/bin/grep -E 'unbound_(up|cache_hits|request_list)'

groups:
  # Watches the launchd automation itself, via success breadcrumbs each
  # script drops into node_exporter's textfile directory
  # (/opt/homebrew/var/lib/node_exporter/textfile). A stale timestamp means
  # the job is silently dead - not running, or running and failing.
  # NB: a job that has NEVER succeeded has no breadcrumb at all, and absent
  # metrics can't fire these rules - seed them once (kickstart each job).
  - name: automation
    rules:
      # daily 03:30 job; 26h = one missed run plus slack
      - alert: BlocklistUpdateStale
        expr: time() - unbound_job_last_success_timestamp_seconds{task="blocklist"} > 93600
        annotations:
          summary: "update-blocklist.sh hasn't succeeded in >26h"

      # daily 23:30 job
      - alert: WarmlistMineStale
        expr: time() - unbound_job_last_success_timestamp_seconds{task="warmlist"} > 93600
        annotations:
          summary: "build-warm-list.sh hasn't succeeded in >26h"

      # monthly job (1st, 03:00); 34d = one missed month plus slack
      - alert: RootHintsRefreshStale
        expr: time() - unbound_job_last_success_timestamp_seconds{task="roothints"} > 2937600
        annotations:
          summary: "unbound-refresh-hints hasn't succeeded in >34 days"

      # breadcrumb predates the current boot = warmboot didn't complete this
      # boot. for: 15m gives the boot sequence (unbound's launch race + the
      # warmup itself) time to finish before this counts as a failure.
      - alert: WarmbootDidNotRun
        expr: |
          (scalar(node_boot_time_seconds)
            - unbound_job_last_success_timestamp_seconds{task="warmboot"}) > 0
        for: 15m
        annotations:
          summary: "warm-at-boot.sh has not succeeded since the last reboot"

      # mirrors the >100k-lines floor update-blocklist.sh enforces on download
      - alert: BlocklistSuspiciouslySmall
        expr: unbound_blocklist_lines < 100000
        annotations:
          summary: "deployed blocklist under 100k lines - truncated or wrong file?"

      # A dead contentcache job is otherwise INVISIBLE: node_exporter keeps
      # serving the last .prom file forever, so every gauge looks alive.
      # The file's own mtime is the only honest freshness signal.
      # Job runs every 300s; 900s = three missed runs.
      - alert: ContentCacheExporterStale
        expr: time() - node_textfile_mtime_seconds{file=~".*apple-content-cache.prom"} > 900
        annotations:
          summary: "apple-content-cache.prom not rewritten in >15m - contentcache job dead?"

      # Catches malformed .prom files (bad exposition format) from ANY
      # textfile writer - the collector skips bad files silently otherwise.
      - alert: TextfileScrapeError
        expr: node_textfile_scrape_error > 0
        annotations:
          summary: "node_exporter textfile collector failed to parse a .prom file"

      # The alert NOTIFIER going stale is the one alert that can't reach your
      # phone (it's the thing that pushes) - it only shows here and on the
      # dashboard. Runs every 120s; 600s = five missed runs.
      - alert: AlertNotifierStale
        expr: time() - unbound_job_last_success_timestamp_seconds{task="alertnotify"} > 600
        annotations:
          summary: "prometheus_alert_notifier.py hasn't succeeded in >10m - phone pushes are dead"

  - name: host
    rules:
      # The TSDB, logs, and Time Machine target all live on this box - catch
      # disk exhaustion before launchd jobs start failing in confusing ways.
      - alert: DiskAlmostFull
        expr: |
          min by (mountpoint) (
            node_filesystem_avail_bytes{fstype=~"apfs|hfs"}
              / node_filesystem_size_bytes{fstype=~"apfs|hfs"}
          ) < 0.10
        for: 30m
        annotations:
          summary: "filesystem {{ $labels.mountpoint }} is over 90% full"

      # Trend-based warning, complementing DiskAlmostFull's instant-percentage
      # check: fires on WHERE THINGS ARE HEADED, before root actually crosses
      # 10%. 3d window (not 24h) + a boot-settled gate are load-bearing, not
      # decoration - verified live 2026-07-06 that a naive 24h-window/no-gate
      # version predicts -237 GiB in 7d on a 7h-old boot, because the box's
      # first day of life includes one-time cost (initial blocklist download,
      # Grafana's first-run plugin installs, pre-compaction TSDB growth) that
      # a short lookback can't distinguish from a recurring daily drain. count_
      # over_time requires the window to be genuinely ~70%+ full of real
      # samples (not just technically present); the boot-settled gate refuses
      # to trust a week-ahead extrapolation until a full day of steady-state
      # history exists past the last restart.
      - alert: RootDiskFreePredictedLow
        expr: |
          predict_linear(node_filesystem_avail_bytes{mountpoint="/"}[3d], 7 * 24 * 3600) < 10 * 1024 * 1024 * 1024
          and count_over_time(node_filesystem_avail_bytes{mountpoint="/"}[3d]) > 12000
          and (time() - node_boot_time_seconds) > 86400
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "root disk trending below 10 GiB free within 7 days at current rate"

      # Short-horizon companion: 6h window is fine for a 24h reach (verified
      # live: 64.95 GiB predicted vs the [3d]->7d version's -237 GiB garbage
      # at the same moment - a week out needs a wider, damped window; a day
      # out doesn't). Still gated on sample count so a freshly-reset TSDB
      # (not just a reboot - node_exporter itself restarting) can't trigger it
      # on a near-empty window.
      - alert: RootDiskFreePredictedCritical
        expr: |
          predict_linear(node_filesystem_avail_bytes{mountpoint="/"}[6h], 24 * 3600) < 5 * 1024 * 1024 * 1024
          and count_over_time(node_filesystem_avail_bytes{mountpoint="/"}[6h]) > 1000
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "root disk trending below 5 GiB free within 24 hours - act now"

  - name: probes
    rules:
      # BOTH public resolvers unreachable on plain :53 from this box - the
      # outside-in signature of the 2026-07-01 incident. max()==0 means every
      # upstream target failed; a single one failing is their outage, not ours.
      - alert: UpstreamDNSPathDown
        expr: max(probe_success{job="blackbox_upstream"}) == 0
        for: 5m
        annotations:
          summary: "1.1.1.1 AND 8.8.8.8 unreachable on :53 - upstream path dead (2026-07-01 signature)"

      # A LAN client's-eye view of unbound failing while the daemon may still
      # look healthy from inside.
      - alert: ResolverEndToEndFailing
        expr: probe_success{job="blackbox_resolver"} == 0
        for: 5m
        annotations:
          summary: "end-to-end resolution through 192.168.0.100 is failing"

      # Canary probe succeeds only while RPZ blocks google-analytics.com.
      # Firing means ad-blocking silently stopped (bad blocklist update,
      # zone misload) - DNS still "works", so nobody would otherwise notice.
      - alert: RPZCanaryNotBlocking
        expr: probe_success{job="blackbox_rpz_canary"} == 0
        for: 30m
        annotations:
          summary: "RPZ is no longer blocking the canary - blocklist likely broken"

      # Grafana down/firewalled (classic cause: brew upgrade changed the
      # Cellar path and invalidated the socketfilterfw allow).
      - alert: GrafanaDown
        expr: up{job="grafana"} == 0
        for: 5m
        annotations:
          summary: "Grafana unreachable on :3000 - dead, or firewall allow lost after brew upgrade"

  - name: unbound
    rules:
      # Exporter itself unreachable (crashed / not loaded).
      - alert: UnboundExporterDown
        expr: up{job="unbound"} == 0
        for: 5m
        annotations:
          summary: "Prometheus cannot scrape unbound_exporter on 127.0.0.1:9167"

      # Exporter is up but unbound-control is not answering. Expected for the
      # first ~10s of boot (known opendirectoryd race); 2m of it is real.
      - alert: UnboundDown
        expr: unbound_up == 0
        for: 2m
        annotations:
          summary: "unbound-control not answering the exporter"

      # The 2026-07-01 incident signature: recursion dead upstream while
      # cache/serve-expired mask it from clients. Requestlist backs up long
      # before the household notices - this is the early tripwire.
      - alert: UnboundRequestListJammed
        expr: sum(unbound_request_list_current_all) > 100
        for: 10m
        annotations:
          summary: "requestlist jammed - upstream path likely dead (see 2026-07-01 incident)"

      # Sustained cold cache during real traffic; ignores idle periods by
      # requiring a minimum query rate before judging the hit ratio.
      # sum() across threads: the counters are per-thread (verified live
      # 2026-07-04), and without it this would fire once per thread.
      - alert: UnboundCacheHitRateLow
        expr: |
          (
            sum(rate(unbound_cache_hits_total[15m]))
              / (sum(rate(unbound_cache_hits_total[15m])) + sum(rate(unbound_cache_misses_total[15m])))
          ) < 0.5
          and (sum(rate(unbound_cache_hits_total[15m])) + sum(rate(unbound_cache_misses_total[15m]))) > 1
        for: 30m
        annotations:
          summary: "cache hit rate below 50% for 30m under real load"
