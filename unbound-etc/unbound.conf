# Unbound — recursive LAN resolver (Mac mini, 192.168.0.100)
# Homebrew service, port 53, localhost + LAN only.

server:
    chroot: ""
    username: "unbound"
    directory: "/opt/homebrew/etc/unbound"

    # --- Network: Ethernet + loopback only (no Wi-Fi, no Tailscale) ---
    interface: 127.0.0.1
    interface: 192.168.0.100
    port: 53
    do-ip4: yes
    do-ip6: no              # host has no working public IPv6 route
    do-udp: yes
    do-tcp: yes

    # --- Access: default refuse, allow loopback + LAN ---
    access-control: 0.0.0.0/0 refuse
    access-control: 127.0.0.0/8 allow
    access-control: 192.168.0.0/24 allow

    # --- Logging (headless) ---
    use-syslog: yes
    verbosity: 1
    log-queries: no
    log-replies: no
    extended-statistics: yes

    # --- Hardening ---
    hide-identity: yes
    hide-version: yes
    harden-glue: yes
    harden-dnssec-stripped: yes
    harden-below-nxdomain: yes
    harden-algo-downgrade: yes
    qname-minimisation: yes
    aggressive-nsec: yes
    deny-any: yes
    # Cache-poisoning tripwire: replies with no matching outstanding query
    # count toward this; past the threshold unbound warns and flushes
    # defensively. 10M is the upstream-documented sane value.
    unwanted-reply-threshold: 10000000
    private-address: 10.0.0.0/8
    private-address: 172.16.0.0/12
    private-address: 192.168.0.0/16
    private-address: 169.254.0.0/16
    do-not-query-localhost: yes

    # --- Rate limiting (rogue-LAN-device guard) ---
    ratelimit: 1000
    ip-ratelimit: 500

    # --- DNSSEC + root ---
    module-config: "respip validator iterator"
    root-hints: "/opt/homebrew/etc/unbound/root.hints"
    auto-trust-anchor-file: "/opt/homebrew/var/lib/unbound/root.key"

    # --- Cache + prefetch + serve-stale ---
    cache-min-ttl: 60
    cache-max-ttl: 86400
    cache-min-negative-ttl: 5
    msg-cache-size: 128m
    rrset-cache-size: 256m
    neg-cache-size: 4m
    prefetch: yes
    prefetch-key: yes
    serve-expired: yes
    serve-expired-ttl: 86400
    serve-expired-reply-ttl: 30
    serve-expired-client-timeout: 0

    # --- Performance (M4, 4 threads; slabs = thread count) ---
    num-threads: 4
    so-reuseport: no
    outgoing-range: 8192
    num-queries-per-thread: 4096
    jostle-timeout: 200
    infra-cache-slabs: 4
    msg-cache-slabs: 4
    rrset-cache-slabs: 4
    key-cache-slabs: 4

    # --- Local .lan zone (edit here, then: unbound-control reload) ---
    local-zone: "lan." static
    local-data: "mini.lan.       IN A 192.168.0.100"
    local-data: "router.lan.     IN A 192.168.0.1"
    local-data: "k1-0217.lan.    IN A 192.168.0.200"
    local-data: "df-4q0ts74.lan. IN A 192.168.0.222"
    local-data-ptr: "192.168.0.100 mini.lan."
    local-data-ptr: "192.168.0.1   router.lan."
    local-data-ptr: "192.168.0.200 k1-0217.lan."
    local-data-ptr: "192.168.0.222 df-4q0ts74.lan."

# Tailscale: .tail3fd0f4.ts.net + 100.64/10 PTR are handled by MagicDNS
# (100.100.100.100) at the OS level — do NOT forward those zones here.

# --- Personal allowlist (evaluated first; passthru wins over block) ---
# Add exceptions to hagezi-allow.rpz, bump its SOA serial, then reload.
rpz:
    name: "hagezi.allow"
    zonefile: "/opt/homebrew/etc/unbound/blocklists/hagezi-allow.rpz"
    rpz-log: yes
    rpz-log-name: "hagezi-allow"

# --- HaGeZi Multi NORMAL blocklist (RPZ; refreshed daily via update-blocklist.sh) ---
# Zone name stays "hagezi.rpz" on purpose — auth_zone_reload commands and the
# update script reference it by that name regardless of which tier is loaded.
rpz:
    name: "hagezi.rpz"
    zonefile: "/opt/homebrew/etc/unbound/blocklists/hagezi-normal.rpz"
    rpz-action-override: nxdomain
    rpz-log: yes
    rpz-log-name: "hagezi-normal"

remote-control:
    control-enable: yes
    control-interface: 127.0.0.1

