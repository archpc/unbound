<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>unbound @ mini.lan</title>
<style>
  :root {
    --bg: #0f1115; --card: #171a21; --border: #2a2f3a;
    --fg: #e4e6eb; --dim: #8b93a1; --accent: #5fd0ff; --accent2: #ffb454; --bad: #ff6b6b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px; background: var(--bg); color: var(--fg);
    font: 14px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .sub { color: var(--dim); margin-bottom: 20px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 16px; }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 8px;
    padding: 14px 16px;
  }
  .card h2 { font-size: 13px; font-weight: 600; margin: 0 0 8px; color: var(--dim); text-transform: uppercase; letter-spacing: .04em; }
  .card .value { font-size: 22px; font-weight: 600; }
  canvas { width: 100%; height: 120px; display: block; }
  table { width: 100%; border-collapse: collapse; }
  td { padding: 3px 0; border-bottom: 1px solid var(--border); }
  td.k { color: var(--dim); }
  td.v { text-align: right; }
  .err { color: var(--bad); }
  .stale { color: var(--accent2); }
</style>
</head>
<body>
  <h1>unbound &mdash; mini.lan</h1>
  <div class="sub" id="status">loading&hellip;</div>

  <div class="grid">
    <div class="card">
      <h2>Queries / sec</h2>
      <div class="value" id="qps-val">&ndash;</div>
      <canvas id="qps-chart"></canvas>
    </div>
    <div class="card">
      <h2>Cache hit rate</h2>
      <div class="value" id="hit-val">&ndash;</div>
      <canvas id="hit-chart"></canvas>
    </div>
    <div class="card">
      <h2>RPZ blocks / interval</h2>
      <div class="value" id="rpz-val">&ndash;</div>
      <canvas id="rpz-chart"></canvas>
    </div>
    <div class="card">
      <h2>Latest snapshot</h2>
      <table id="snapshot"></table>
    </div>
  </div>

<script>
const REFRESH_MS = 60000;

function drawLineChart(canvas, points, color) {
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.clientWidth, h = canvas.clientHeight;
  canvas.width = w * dpr; canvas.height = h * dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, w, h);
  if (points.length < 2) {
    ctx.fillStyle = '#8b93a1';
    ctx.fillText('not enough data yet', 8, h / 2);
    return;
  }
  const xs = points.map(p => p[0]), ys = points.map(p => p[1]);
  const xMin = Math.min(...xs), xMax = Math.max(...xs);
  const yMin = 0, yMax = Math.max(...ys) * 1.1 || 1;
  const pad = 4;
  const sx = t => pad + (t - xMin) / (xMax - xMin || 1) * (w - pad * 2);
  const sy = v => h - pad - (v - yMin) / (yMax - yMin || 1) * (h - pad * 2);

  // gridline at mid-height
  ctx.strokeStyle = '#2a2f3a'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(0, h / 2); ctx.lineTo(w, h / 2); ctx.stroke();

  ctx.strokeStyle = color; ctx.lineWidth = 1.5;
  ctx.beginPath();
  points.forEach(([t, v], i) => {
    const x = sx(t), y = sy(v);
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  });
  ctx.stroke();
}

function fmt(n) {
  if (n === undefined || n === null || isNaN(n)) return '–';
  if (n >= 1e6) return (n / 1e6).toFixed(2) + 'M';
  if (n >= 1e3) return (n / 1e3).toFixed(1) + 'k';
  return Number.isInteger(n) ? String(n) : n.toFixed(2);
}

async function load() {
  const statusEl = document.getElementById('status');
  let rows;
  try {
    const res = await fetch('data/stats.jsonl?_=' + Date.now());
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const text = await res.text();
    rows = text.split('\n').filter(Boolean).map(l => {
      try { return JSON.parse(l); } catch { return null; }
    }).filter(Boolean).sort((a, b) => a.ts - b.ts);
  } catch (e) {
    statusEl.textContent = 'failed to load data/stats.jsonl: ' + e.message;
    statusEl.className = 'sub err';
    return;
  }

  if (rows.length === 0) {
    statusEl.textContent = 'no samples yet — poll-stats.sh hasn’t run, or hasn’t completed a cycle';
    statusEl.className = 'sub stale';
    return;
  }

  const latest = rows[rows.length - 1];
  const ageMin = (Date.now() / 1000 - latest.ts) / 60;
  statusEl.textContent = `${rows.length} samples over the last ${((latest.ts - rows[0].ts) / 3600).toFixed(1)}h — last sample ${ageMin.toFixed(1)} min ago`;
  statusEl.className = ageMin > 15 ? 'sub stale' : 'sub';

  // Queries/sec: delta of total.num.queries between consecutive samples,
  // clamped at 0 (a negative delta means unbound restarted and its
  // cumulative counters reset).
  const qps = [];
  for (let i = 1; i < rows.length; i++) {
    const dt = rows[i].ts - rows[i - 1].ts;
    const dq = rows[i]['total.num.queries'] - rows[i - 1]['total.num.queries'];
    if (dt > 0) qps.push([rows[i].ts, Math.max(0, dq) / dt]);
  }
  document.getElementById('qps-val').textContent = qps.length ? fmt(qps[qps.length - 1][1]) : '–';
  drawLineChart(document.getElementById('qps-chart'), qps, '#5fd0ff');

  // Cache hit rate: per-interval ratio of delta hits to delta total lookups.
  const hitRate = [];
  for (let i = 1; i < rows.length; i++) {
    const dh = rows[i]['total.num.cachehits'] - rows[i - 1]['total.num.cachehits'];
    const dm = rows[i]['total.num.cachemiss'] - rows[i - 1]['total.num.cachemiss'];
    const total = dh + dm;
    if (dh >= 0 && dm >= 0 && total > 0) hitRate.push([rows[i].ts, 100 * dh / total]);
  }
  document.getElementById('hit-val').textContent = hitRate.length ? hitRate[hitRate.length - 1][1].toFixed(1) + '%' : '–';
  drawLineChart(document.getElementById('hit-chart'), hitRate, '#7ee787');

  // RPZ blocks: sum of any field whose name mentions "rpz" (we don't
  // hardcode which counter this unbound version reports), per interval.
  const rpzKeys = Object.keys(latest).filter(k => /rpz/i.test(k) && typeof latest[k] === 'number');
  const rpz = [];
  if (rpzKeys.length) {
    for (let i = 1; i < rows.length; i++) {
      const sum = r => rpzKeys.reduce((a, k) => a + (r[k] || 0), 0);
      const d = sum(rows[i]) - sum(rows[i - 1]);
      if (d >= 0) rpz.push([rows[i].ts, d]);
    }
    document.getElementById('rpz-val').textContent = rpz.length ? fmt(rpz[rpz.length - 1][1]) : '–';
  } else {
    document.getElementById('rpz-val').textContent = 'n/a';
    document.querySelector('#rpz-chart').replaceWith(Object.assign(document.createElement('div'), {
      className: 'sub', textContent: 'no RPZ counters reported by this unbound version'
    }));
  }
  const rpzCanvas = document.getElementById('rpz-chart');
  if (rpzCanvas) drawLineChart(rpzCanvas, rpz, '#ffb454');

  // Latest snapshot table: a handful of the most legible fields.
  const wanted = [
    'total.num.queries', 'total.num.cachehits', 'total.num.cachemiss',
    'total.num.recursivereplies', 'time.up', 'mem.cache.rrset', 'mem.cache.message'
  ];
  const tbl = document.getElementById('snapshot');
  tbl.innerHTML = wanted.filter(k => k in latest).map(k =>
    `<tr><td class="k">${k}</td><td class="v">${fmt(latest[k])}</td></tr>`
  ).join('');
}

load();
setInterval(load, REFRESH_MS);
</script>
</body>
</html>
